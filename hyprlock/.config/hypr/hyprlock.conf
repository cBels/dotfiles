$font = Monospace

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# DP-2 (OLED) — pure black, no elements to protect the panel
background {
    monitor = DP-2
    color = rgba(000000ff)
}

# HDMI-A-1 (Ultrawide IPS) — Gruvbox Dark background
background {
    monitor = HDMI-A-1
    color = rgba(282828ff)
}

# Clock
label {
    monitor = HDMI-A-1
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgba(ebdbb2ff)    # fg

    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor = HDMI-A-1
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 24
    font_family = $font
    color = rgba(d5c4a1ff)    # fg1

    position = 0, 20
    halign = center
    valign = center
}

# Password input
input-field {
    monitor = HDMI-A-1
    size = 380, 52
    outline_thickness = 2
    rounding = 0

    inner_color = rgba(3c3836cc)    # bg1
    outer_color = rgba(83a598ff)    # bright blue
    check_color = rgba(b8bb26ff)    # bright green
    fail_color = rgba(fb4934ff)     # bright red

    font_color = rgba(ebdbb2ff)
    font_family = $font
    fade_on_empty = true
    placeholder_text = Password
    fail_text = $PAMFAIL

    dots_spacing = 0.35
    dots_size = 0.33

    position = 0, -60
    halign = center
    valign = center
}

# Keyboard layout indicator
label {
    monitor = HDMI-A-1
    text = $LAYOUT[en,no]
    font_size = 16
    font_family = $font
    color = rgba(7c6f64ff)    # bg4
    onclick = hyprctl switchxkblayout all next

    position = 0, -130
    halign = center
    valign = center
}
