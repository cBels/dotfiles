general {
    lock_cmd = pidof hyprlock || hyprlock       # prevent multiple instances
    before_sleep_cmd = loginctl lock-session    # lock on suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # wake all displays on resume
    ignore_dbus_inhibit = false
}

# 1 min: dim OLED (DP-2, display 2) — protect early
listener {
    timeout = 60
    on-timeout = ddcutil setvcp 10 20 --display 1 && ddcutil setvcp 10 20 --display 2
    on-resume = ddcutil setvcp 10 70 --display 1 && ddcutil setvcp 10 100 --display 2
}

# 3 min: dim ultrawide IPS (HDMI-A-1, display 1)
listener {
    timeout = 180
    on-timeout = ddcutil setvcp 10 20 --display 1 && ddcutil setvcp 10 20 --display 2
    on-resume = ddcutil setvcp 10 70 --display 1 && ddcutil setvcp 10 100 --display 2
}

# 5 min: lock screen + turn off all displays
listener {
    timeout = 300
    on-timeout = loginctl lock-session; hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 1 hour: turn off all displays (failsafe)
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
