general {
    lock_cmd = pidof hyprlock || hyprlock       # prevent multiple instances
    before_sleep_cmd = loginctl lock-session    # lock on suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # wake all displays on resume
    ignore_dbus_inhibit = false
}

# 1 min: dim via shader (software-only, safe when monitors on other input)
listener {
    timeout = 60
    on-timeout = hyprctl eval 'hl.config({ decoration = { screen_shader = "/home/cbels/.config/hypr/dim.frag", dim_inactive = false } })'
    on-resume = hyprctl eval 'hl.config({ decoration = { screen_shader = "[[EMPTY]]", dim_inactive = true } })'
}

# 5 min: lock screen + turn off all displays
listener {
    timeout = 300
    on-timeout = loginctl lock-session; hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 1 hour: turn off all displays (failsafe)
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
